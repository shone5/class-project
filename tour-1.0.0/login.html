<body>
<div class="page">
  
  <div class="panel">
    <div class="panel__visible">
      <div class="panel__content">
        <h1 class="panel__title">  Sign Up </h1>
        <form class="form">
          <label class="form__label" for="fullname">Full Name</label>
          <input class="form__input" type="text" id="fullname" name="fullname">

          <label class="form__label" for="username">Username</label>
          <input class="form__input" type="text" id="username" name="username">
          <label class="form__label" for="password">Password</label>
          <input class="form__input " type="password" id="password" name="password">
          <button class="form__btn" type="button" value="Submit">Submit</button>

          <button class="form__toggle js-formToggle" type="button">Or, Sign In</button>
        </form>
      </div>
      <div class="panel__content panel__content--overlay js-panel__content ">
        <h1 class="panel__title">  Sign In </h1>
        <form class="form">
          <label class="form__label" for="usernameIn">Username</label>
          <input class="form__input" type="text" id="usernameIn" name="usernameIn">

          
          <label class="form__label" for="passwordIn">Password</label>
          <input class="form__input " type="password" id="passwordIn" name="passwordIn">
          <a class="form__btn" type="button" href='index.html'value="Submit">Sign In</a>
          <br>
          <button class="form__toggle js-formToggle" type="button">Or, Sign Up</button>
          <a href="index.html">Back to Home</a>
        </form>
      </div>
    </div>
    <div class="panel__back js-imageAnimate">
      <img class="panel__img" src="https://images.unsplash.com/photo-1580111161432-64ca21daa33d?ixlib=rb-1.2.1&q=80&fm=jpg&crop=entropy&cs=tinysrgb&w=1080&fit=max" />
    </div>
  </div>

</div>
<script>
    var toggleBtns = document.querySelectorAll('.js-formToggle');
for(var i = 0; i < toggleBtns.length; i++){
  toggleBtns[i].addEventListener("click", toggleForm);
}  


var firstClick = true; 

function toggleForm(){
  
  if(!firstClick){
    document.querySelector('.js-imageAnimate').classList.toggle("animate");
    document.querySelector('.js-imageAnimate').classList.toggle("animateOut");
 
  
    document.querySelector('.js-panel__content').classList.toggle("animate");
    document.querySelector('.js-panel__content').classList.toggle("animateOut");
  }
  else{
    firstClick = false;
        document.querySelector('.js-imageAnimate').classList.add("animate");
    document.querySelector('.js-panel__content').classList.add("animate");

  }
  
}
</script>

</body>
<style>
    body, html{
  font-family: Ariel, sans-serif;
  width:100%;
  height:100%;
  margin:0;
  padding:0;
  display:inline-block;
  overflow-x: hidden;
}
.page{
  display:flex;
  flex-flow:row;
  flex-wrap:nowrap;
  align-items:center;
  justify-content:center;
  width:100%;
  height:100%;
  background-color: #65A192;
}
.panel{
 
  display:inline-block;
  position:relative;
}

.panel__visible{
    position:relative;

  overflow: hidden;
}
.panel__title{
  margin-top: .5em;
  margin-bottom: 1.2em;
}



.panel__content{ 
  padding: 20px;
  background-color: white;
  z-index:10;
  position:relative;
}
.panel__content--overlay{
  position:absolute;
  top:0;
  left:100%;
  height:100%;
}

.panel__content.animate{
  
  animation: movePanel 2s forwards ;
}

@keyframes movePanel{
  
  0%, 30%{
    transform: translateX(0%);
    
  }
  35%, 100%{
   transform: translateX(-100%);
    
  }
  
}
.panel__content.animateOut{
  
  animation: movePanelOut 2s forwards ;
}
@keyframes movePanelOut{
  0%, 30%{
    transform: translateX(-100%);
    
  }
  35%, 100%{
   transform: translateX(0%);
    
  }
}
.panel__back{
  position:absolute;
  z-index:0;
  top:50%;
  left: 0;
  width:110%;
  transform: translate(70%,-50%);
}

.panel__back.animate{
  
  animation: move 2s forwards ;
}

@keyframes move{
  0{
    transform: translate(70%,-50%);
    z-index:0;
  }
  15%{
    transform: translate(140%,-50%);
    z-index:10;
  }
  75%{
   transform: translate(-120%,-50%);
    z-index:10;
  }
  100%{
    transform: translate(-50%,-50%);
    z-index:0;
  }
}
.panel__back.animateOut{
  transform: translate(-50%,-50%);
  animation: moveOut 2s forwards ;
}
@keyframes moveOut{
  0{
    transform: translate(-50%,-50%);
    z-index:0;
  }
  15%{
   transform: translate(-120%,-50%);
    z-index:10;
  }
  75%{
    transform: translate(140%,-50%);
    z-index:10;
  }
  100%{
    transform: translate(70%,-50%);
    z-index:0;
  }
  
  
  
}
.panel__img{
  width:100%;
  display:block;
}

/* Form */
.form{
  box-sizing:border-box;
}
.form__label{
  display:block;
  color: #3D3D3D;
  font-weight: 600;
  margin-bottom: 5px;
}

  border-radius: 3px;

  width: 250px;
  box-sizing:border-box;
  position:relative;
}
.form__input:focus{

  outline-color: #33A192;
}

  position:absolute;
  top: 0;

  height: 50px;
  width: 50px;
  background-color: red;
}
.form__btn{
  margin-top: 1.2em;
  margin-bottom: 2em;
  display:block;
  width:100%;
  background-color: #33A192;
  color: white;
  border:none;
  padding: .6em;
  text-transform: uppercase;
  font-weight: 500;
  font-size: 1.1em;
  border-radius: 3px;

.form__toggle{
  background-color: transparent;
  border: none;
  padding: 0;

    border-bottom: 1px solid transparent;

}
